apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: rv-college
      defaultBucket: parking_analytics
      tlsSkipVerify: true
    secureJsonData:
      token: parking-super-secret-token
    isDefault: true
    editable: true

  - name: InfluxDB-Parking
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: rv-college
      defaultBucket: parking_analytics
      tlsSkipVerify: true
    secureJsonData:
      token: parking-super-secret-token
    isDefault: false
    editable: true
